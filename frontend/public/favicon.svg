<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Main Sphere Gradient -->
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#7dd3fc" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Orbital Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Canvas -->
  <rect width="64" height="64" rx="16" fill="#0c0d12" />

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#bgGlow)" />

  <!-- Outer Orbital Ring -->
  <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" transform="rotate(-25 32 32)" filter="url(#cyanGlow)" />

  <!-- 3D Aegis Orb -->
  <circle cx="32" cy="32" r="17" fill="url(#sphereGrad)" filter="url(#cyanGlow)" />

  <!-- Sphere Specular Highlight -->
  <ellipse cx="26" cy="23" rx="6" ry="4" fill="#ffffff" opacity="0.75" transform="rotate(-30 26 23)" />

  <!-- Orbit Particle Accent -->
  <circle cx="48" cy="20" r="2.5" fill="#38bdf8" filter="url(#cyanGlow)" />
</svg>